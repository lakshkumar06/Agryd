# Netlify configuration for Next.js
# IMPORTANT: Configure these in Netlify Dashboard (Site settings → Build & deploy):
#   - Base directory: frontend
#   - Publish directory: MUST BE EMPTY/BLANK (do not set to "frontend" or anything else)
#   - Build command: npm install && npm run build

[build]
  command = "npm install && npm run build"
  # NOTE: Do NOT set 'base' or 'publish' in this file - only configure in dashboard
  # The Next.js plugin will fail if base = publish, so keep publish empty in dashboard

# Next.js plugin - automatically handles publish directory
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables - set these in Netlify Dashboard:
# Site settings → Environment variables
# - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY (mark as Secret)
# - NEXT_PUBLIC_SUPADEMO_EMBED_URL (mark as Secret, optional)

# Omit NEXT_PUBLIC_* variables from secrets scanning
# These are intentionally public and embedded in client-side code
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY,NEXT_PUBLIC_SUPADEMO_EMBED_URL"

# Redirect rules are handled automatically by Next.js plugin
