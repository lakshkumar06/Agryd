# Netlify configuration for Next.js
# IMPORTANT: Set these in Netlify Dashboard (Site settings → Build & deploy):
#   - Base directory: frontend
#   - Publish directory: (leave EMPTY - Next.js plugin handles it automatically)
#   - Build command: npm install && npm run build

[build]
  # Build command (runs from base directory set in dashboard)
  command = "npm install && npm run build"
  # NOTE: Do NOT set 'base' or 'publish' here - configure in dashboard instead

# Next.js plugin - automatically handles publish directory
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables - set these in Netlify Dashboard:
# Site settings → Environment variables
# - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
# - NEXT_PUBLIC_SUPADEMO_EMBED_URL (optional)

# Node version (recommended for Next.js 16)
[build.environment]
  NODE_VERSION = "20"

# Redirect rules are handled automatically by Next.js plugin
