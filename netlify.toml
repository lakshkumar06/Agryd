[build]
  # Base directory for the frontend
  base = "frontend"
  
  # Build command runs from the base directory
  command = "npm install && npm run build"
  
  # IMPORTANT: Do NOT set publish directory for Next.js plugin
  # The @netlify/plugin-nextjs plugin handles this automatically
  # Leaving it unset prevents the "base = publish" error

# Next.js plugin configuration (handles publish directory automatically)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables - set these in Netlify Dashboard under Site settings > Environment variables
# - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
# - NEXT_PUBLIC_SUPADEMO_EMBED_URL (optional)

# Node version (recommended for Next.js 16)
[build.environment]
  NODE_VERSION = "20"

# Redirect rules are handled automatically by Next.js plugin

